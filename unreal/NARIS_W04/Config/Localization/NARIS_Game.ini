[CommonSettings]
SourcePath=Content/Localization/NARIS_Game
DestinationPath=Content/Localization/NARIS_Game
ManifestName=NARIS_Game.manifest
ArchiveName=NARIS_Game.archive
PortableObjectName=NARIS_Game.po
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=ar

[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Source/NARIS_W04
FileNameFilters=*.h
FileNameFilters=*.cpp
ShouldGatherFromEditorOnlyData=false

[GatherTextStep1]
CommandletClass=GatherTextFromAssets
IncludePathFilters=/Game/NARIS/*
PackageFileNameFilters=*.umap
PackageFileNameFilters=*.uasset
ShouldExcludeDerivedClasses=false

[GatherTextStep2]
CommandletClass=GenerateGatherManifest

[GatherTextStep3]
CommandletClass=GenerateGatherArchive

[GatherTextStep4]
CommandletClass=InternationalizationExport
bImportLoc=true

[GatherTextStep5]
CommandletClass=InternationalizationExport
bExportLoc=true

[GatherTextStep6]
CommandletClass=GenerateTextLocalizationResource
