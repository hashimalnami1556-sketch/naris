name: CHAR-001 offline rig contract
# Intentionally NOT a Blender, Unreal, gameplay, multiplayer or packaging gate.
on:
  push:
    paths:
      - 'tools/blender/naris_advanced_rig_weight_gate.py'
      - 'tools/blender/naris_rig_spec_contract.py'
      - 'tests/test_naris_rig_spec_contract.py'
      - 'docs/characters/char-001/ash-wanderer-source-spec-v1.json'
      - '.github/workflows/char001-rig-contract.yml'
  pull_request:
    paths:
      - 'tools/blender/naris_advanced_rig_weight_gate.py'
      - 'tools/blender/naris_rig_spec_contract.py'
      - 'tests/test_naris_rig_spec_contract.py'
      - 'docs/characters/char-001/ash-wanderer-source-spec-v1.json'
      - '.github/workflows/char001-rig-contract.yml'
jobs:
  static-rig-contract:
    name: Python contract tests (not Blender / Unreal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8,<10'
      - run: python -m py_compile tools/blender/naris_advanced_rig_weight_gate.py tools/blender/naris_rig_spec_contract.py
      - run: python -m pytest -q tests/test_naris_rig_spec_contract.py
