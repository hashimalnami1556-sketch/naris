name: P0 Hero Self-Hosted Production

on:
  push:
    paths:
      - data/P0_HERO_RUN_REQUEST.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-hero-self-hosted
  cancel-in-progress: false

jobs:
  hero-production:
    name: P0-01 to P0-04B on AsusRog
    runs-on: [self-hosted, windows, unreal]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify local production tools
        shell: powershell
        run: |
          $blender = 'C:\Program Files\Blender Foundation\Blender 5.2\blender.exe'
          $ue = 'C:\Program Files\Epic Games\UE_5.7\Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $ueGui = 'C:\Program Files\Epic Games\UE_5.7\Engine\Binaries\Win64\UnrealEditor.exe'
          $project = 'C:\Users\Admin\OneDrive\NARIS_MASTER_BUNDLE\Game\NARIS_UE57\NARIS.uproject'
          foreach ($p in @($blender,$ue,$ueGui,$project)) {
            if (-not (Test-Path -LiteralPath $p)) { throw "Required production path missing: $p" }
          }
          Write-Host 'P0_LOCAL_TOOLS_READY=1'

      - name: Run atomic hero production pipeline
        shell: cmd
        run: |
          call "%GITHUB_WORKSPACE%\tools\windows\run_p0_hero_to_unreal.bat"

      - name: Render P0-04B D3D12 comparison screenshot
        shell: powershell
        run: |
          $ueGui = 'C:\Program Files\Epic Games\UE_5.7\Engine\Binaries\Win64\UnrealEditor.exe'
          $projectRoot = 'C:\Users\Admin\OneDrive\NARIS_MASTER_BUNDLE\Game\NARIS_UE57'
          $uproject = Join-Path $projectRoot 'NARIS.uproject'
          $screenDir = Join-Path $projectRoot 'Saved\Screenshots\Windows'
          New-Item -ItemType Directory -Force $screenDir | Out-Null
          Get-ChildItem $screenDir -Filter '*.png' -ErrorAction SilentlyContinue | Remove-Item -Force
          & $ueGui $uproject /Game/NARIS/QA/L_HeroCandidate_QA -game -d3d12 -windowed -ResX=1920 -ResY=1080 -nosplash -BENCHMARK -SECONDS=10 -ExecCmds="HighResShot 1" -log
          if ($LASTEXITCODE -ne 0) { throw "P0-04B D3D12 render exited with $LASTEXITCODE" }
          $shot = Get-ChildItem $screenDir -Filter '*.png' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $shot) { throw 'P0-04B screenshot was not produced.' }
          $canonicalShot = Join-Path $screenDir 'P0-04B_HeroCompare.png'
          Copy-Item $shot.FullName $canonicalShot -Force
          $hash = (Get-FileHash -LiteralPath $canonicalShot -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item -LiteralPath $canonicalShot).Length
          $sceneReportPath = Join-Path $projectRoot 'Reports\P0-04B_visual_scene.json'
          if (-not (Test-Path -LiteralPath $sceneReportPath)) { throw 'P0-04B scene report missing.' }
          $scene = Get-Content -Raw -LiteralPath $sceneReportPath | ConvertFrom-Json
          $evidence = [ordered]@{
            schema_version = '1.0.0'
            pipeline_revision = 'p0-04b-hashbound-camera-v2'
            status = 'PASS'
            screenshot = 'P0-04B_HeroCompare.png'
            screenshot_path = $canonicalShot
            screenshot_sha256 = $hash
            screenshot_bytes = $bytes
            candidate = $scene.candidate
            baseline = $scene.baseline
            qa_map = $scene.qa_map
            git_sha = $env:GITHUB_SHA
            workflow_run_id = $env:GITHUB_RUN_ID
          }
          $evidencePath = Join-Path $projectRoot 'Reports\P0-04B_render_evidence.json'
          $evidence | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8NoBOM -LiteralPath $evidencePath
          Write-Host "P0_04B_SCREENSHOT=$canonicalShot"
          Write-Host "P0_04B_SHA256=$hash"
          Write-Host "P0_04B_BYTES=$bytes"

      - name: Collect gate evidence
        if: always()
        shell: powershell
        run: |
          $projectRoot = 'C:\Users\Admin\OneDrive\NARIS_MASTER_BUNDLE\Game\NARIS_UE57'
          $dest = Join-Path $env:GITHUB_WORKSPACE 'artifacts\p0_hero'
          New-Item -ItemType Directory -Force $dest | Out-Null
          $files = @(
            (Join-Path $projectRoot 'Production\Hero\P0-01_reimport_log.json'),
            (Join-Path $projectRoot 'Production\Hero\P0-02_rig_pbr_log.json'),
            (Join-Path $projectRoot 'Reports\P0-03_unreal_hero_import.json'),
            (Join-Path $projectRoot 'Reports\P0-04A_hero_technical_qa.json'),
            (Join-Path $projectRoot 'Reports\P0-04B_visual_scene.json'),
            (Join-Path $projectRoot 'Reports\P0-04B_render_evidence.json'),
            (Join-Path $projectRoot 'Saved\Screenshots\Windows\P0-04B_HeroCompare.png')
          )
          foreach ($f in $files) {
            if (Test-Path -LiteralPath $f) { Copy-Item -LiteralPath $f -Destination $dest -Force }
          }
          $hero = Join-Path $projectRoot 'Production\Hero\SK_AshenVessel_PBR.fbx'
          if (Test-Path -LiteralPath $hero) { Copy-Item -LiteralPath $hero -Destination $dest -Force }
          Get-ChildItem $dest | Select-Object Name,Length,LastWriteTime | Format-Table -AutoSize

      - name: Upload P0 hero evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CALL-OF-NARIS-P0-Hero-Evidence
          path: artifacts/p0_hero
          retention-days: 7
          if-no-files-found: warn
          compression-level: 0
