name: NARIS Expansion Reference Tests
on:
  pull_request:
    paths:
      - 'tools/expansion/**'
      - '.github/workflows/naris-expansion-tests.yml'
  push:
    paths:
      - 'tools/expansion/**'
permissions:
  contents: read
jobs:
  reference-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Battle-pass claim reference tests
        run: python -m unittest discover -s tools/expansion -p 'test_*.py' -v
