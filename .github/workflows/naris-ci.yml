name: NARIS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      package_mode:
        description: Windows package gate to execute
        required: true
        default: development
        type: choice
        options:
          - development
          - release_candidate

permissions:
  contents: read

concurrency:
  group: naris-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Repository + JSON validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test AssetForge and Unreal static guards
        run: |
          python -m unittest discover -s tools/assetforge -v
          python -m unittest discover -s tools/ci -v
      - name: Validate NARIS repository
        run: python tools/ci/validate_naris.py
      - name: Parse Windows production launchers
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem "tools/windows" -Filter "*.ps1" | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.ToString()) [$($_.FullName)]" }
            } else {
              Write-Host "PowerShell syntax OK: $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

  mcp-build:
    name: MCP TypeScript build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build MCP server
        run: npm run build

  unreal-project-check:
    name: Unreal project integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate .uproject JSON
        run: python -c "import json; json.load(open('unreal/NARIS_W04/NARIS_W04.uproject', encoding='utf-8')); print('Unreal .uproject JSON OK')"

  unreal-build-self-hosted:
    name: Unreal Windows package gate
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, windows, unreal]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Unreal Engine path
        shell: powershell
        run: |
          if (-not $env:UNREAL_ENGINE_ROOT) { throw 'UNREAL_ENGINE_ROOT runner variable is not configured.' }
          if (-not (Test-Path $env:UNREAL_ENGINE_ROOT)) { throw "UNREAL_ENGINE_ROOT does not exist: $env:UNREAL_ENGINE_ROOT" }
      - name: Development build, runtime smoke, and profiling
        if: ${{ inputs.package_mode == 'development' }}
        shell: powershell
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'tools/windows/Invoke-NarisWindowsPackage.ps1'
          & $script -RepoRoot $env:GITHUB_WORKSPACE -UnrealEngineRoot $env:UNREAL_ENGINE_ROOT
      - name: Shipping release candidate gate
        if: ${{ inputs.package_mode == 'release_candidate' }}
        shell: powershell
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'tools/windows/Invoke-NarisWindowsReleaseCandidate.ps1'
          & $script -RepoRoot $env:GITHUB_WORKSPACE -UnrealEngineRoot $env:UNREAL_ENGINE_ROOT
      - name: Upload Development smoke build
        if: ${{ inputs.package_mode == 'development' }}
        uses: actions/upload-artifact@v4
        with:
          name: NARIS_W04-Windows-Development
          path: artifacts/windows/NARIS_W04
          retention-days: 7
          compression-level: 0
      - name: Upload Shipping release candidate
        if: ${{ inputs.package_mode == 'release_candidate' }}
        uses: actions/upload-artifact@v4
        with:
          name: NARIS_W04-Windows-Shipping-RC
          path: artifacts/windows/NARIS_W04_RC
          retention-days: 14
          compression-level: 0
