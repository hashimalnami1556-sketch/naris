name: CHAR-022 Cloth Topology Contracts
on:
  push:
    branches: [feature/CHAR-022-skin-binding]
    paths:
      - 'tools/assetforge/char022_cloth_topology.py'
      - 'tools/assetforge/test_char022_cloth_topology.py'
      - 'tools/assetforge/manifold_review.py'
      - 'tools/assetforge/test_char022_manifold_review.py'
      - '.github/workflows/char022-cloth-topology.yml'
  pull_request:
    paths:
      - 'tools/assetforge/char022_cloth_topology.py'
      - 'tools/assetforge/test_char022_cloth_topology.py'
      - 'tools/assetforge/manifold_review.py'
      - 'tools/assetforge/test_char022_manifold_review.py'
      - '.github/workflows/char022-cloth-topology.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NumPy
        run: python -m pip install numpy==2.2.6
      - name: Test topology cleanup and fail-closed gate
        run: |
          python -m unittest discover -s tools/assetforge -p 'test_char022_cloth_topology.py' -v
          python -m unittest discover -s tools/assetforge -p 'test_char022_manifold_review.py' -v
      - name: Check source syntax
        run: python -m py_compile tools/assetforge/char022_cloth_topology.py tools/assetforge/manifold_review.py
      - name: Mark evidence scope
        run: |
          echo 'Synthetic offline topology tests only; original asset review and actual Unreal physics remain separate gates.'
