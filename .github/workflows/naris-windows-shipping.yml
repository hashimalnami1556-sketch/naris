name: NARIS Windows Shipping
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/windows/Build-NarisWindows.ps1'
      - 'tools/windows/Invoke-NarisWindowsReleaseCandidate.ps1'
      - 'unreal/NARIS_W04/Content/Python/naris_*shipping*'
      - 'unreal/NARIS_W04/Content/Python/naris_stage8_promote_final_map.py'
      - '.github/workflows/naris-windows-shipping.yml'
permissions:
  contents: read
concurrency:
  group: naris-windows-shipping-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source and map snapshot rules
        run: |
          python tools/ci/validate_naris.py
          python -m unittest discover -s tools/ci -p 'test_shipping*.py' -v
      - name: Parse Windows launchers
        shell: pwsh
        run: |
          foreach ($file in @('tools/windows/Build-NarisWindows.ps1', 'tools/windows/Invoke-NarisWindowsReleaseCandidate.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
  shipping:
    needs: source-gates
    runs-on: [self-hosted, windows, unreal]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Build gated Windows Shipping package
        shell: powershell
        run: .\tools\windows\Build-NarisWindows.ps1 -Configuration Shipping
      - name: Retain package and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NARIS-Windows-Shipping-${{ github.run_id }}
          path: |
            Builds/Windows_Shipping/**
            unreal/NARIS_W04/Saved/TestReports/**
            unreal/NARIS_W04/Saved/Logs/**
          if-no-files-found: warn
