name: ANIM-024 Source Motion Coverage
on:
  push:
    branches: [feature/ANIM-024-source-coverage-gate]
    paths: ['tools/assetforge/anim024_audit.py', 'tools/assetforge/anim024_dev_motion.py', 'tools/assetforge/render_anim024.py', 'tools/assetforge/anim024_ik_chain_contract.py', 'tools/assetforge/anim024_unreal_ikrig_review.py', 'tests/anim024/**', 'docs/changes/ANIM-024/**', '.github/workflows/anim024-coverage.yml']
  pull_request:
    paths: ['tools/assetforge/anim024_audit.py', 'tools/assetforge/anim024_dev_motion.py', 'tools/assetforge/render_anim024.py', 'tools/assetforge/anim024_ik_chain_contract.py', 'tools/assetforge/anim024_unreal_ikrig_review.py', 'tests/anim024/**', '.github/workflows/anim024-coverage.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  animation-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal matrix math dependency
        run: python -m pip install numpy==2.3.5
      - name: Run original-asset-safe source and dev-motion contracts
        run: |
          python -m py_compile tools/assetforge/anim024_audit.py tools/assetforge/anim024_dev_motion.py tools/assetforge/render_anim024.py tools/assetforge/anim024_ik_chain_contract.py tools/assetforge/anim024_unreal_ikrig_review.py
          python -m unittest discover -s tests/anim024 -v
      - run: |
          echo 'Offline DEV motion logic only. Source GLB asset tests are in the user handoff and explicitly skipped in GitHub CI.'
          echo 'Only source IK chains and a dry-run UE5.7 installer are present; no imported SkeletalMesh, IKRig/IKRetargeter uasset, PIE, network or release claim.'
