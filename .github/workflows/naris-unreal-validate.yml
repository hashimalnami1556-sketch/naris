name: NARIS Unreal Validate

on:
  pull_request:
    paths:
      - "unreal/**"
      - "tools/ci/**"
      - ".github/workflows/naris-unreal-validate.yml"
  push:
    branches: [main, feature/naris-md-components-integration]
    paths:
      - "unreal/**"
      - "tools/ci/**"

jobs:
  static-contract-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Unreal project files
        shell: bash
        run: |
          test -s unreal/NARIS_W04/NARIS_W04.uproject
          test -s unreal/NARIS_W04/Config/DefaultEngine.ini
          test -s unreal/NARIS_W04/Source/NARIS_W04/NARIS_W04.Build.cs
          python tools/ci/validate_naris.py
          python -m unittest discover -s tools/ci -p 'test_ui016_*.py' -v
          python -m unittest discover -s tools/ci -p 'test_ui017_*.py' -v
          python -m unittest discover -s tools/ci -p 'test_ui018_*.py' -v
          python -m unittest discover -s tools/ci -p 'test_ui019_*.py' -v
          python -m py_compile tools/ui/import_naris_ui016_icons.py
          grep -F '+DirectoriesToAlwaysCook=(Path="/Game/NARIS/UI/Icons")' unreal/NARIS_W04/Config/DefaultGame.ini
          test -s unreal/NARIS_W04/Content/NARIS/W04/Data/W04_VerticalSliceManifest.json
          test -s unreal/NARIS_W04/Content/NARIS/W04/QA/W04_ACCEPTANCE_TESTS.md
          echo "NARIS Unreal repository contracts are non-empty and present."
