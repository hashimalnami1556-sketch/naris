<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CALL OF NARIS — Asset Factory Preview</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#05060a;color:#e8ecf4;font-family:Inter,system-ui,sans-serif}
    #renderCanvas{width:100%;height:100%;display:block;touch-action:none}
    #ui{position:fixed;top:18px;left:18px;z-index:2;min-width:300px;padding:14px 16px;border:1px solid #38415a;background:rgba(7,9,15,.82);backdrop-filter:blur(10px);border-radius:12px;box-shadow:0 14px 50px rgba(0,0,0,.45)}
    h1{font-size:16px;margin:0 0 8px} p{font-size:12px;opacity:.72;margin:0 0 12px}
    button{margin:3px;padding:8px 10px;border-radius:8px;border:1px solid #47516c;background:#111624;color:#fff;cursor:pointer}
    button:hover{background:#1a2134}.active{outline:2px solid #65d9ff}
    #status{margin-top:10px;font:11px ui-monospace,monospace;color:#83e7ff}
  </style>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<div id="ui">
  <h1>CALL OF NARIS — Procedural Asset Factory</h1>
  <p>Babylon preview / character switching / transparent-material QA.</p>
  <div id="buttons"></div>
  <div id="status">Booting…</div>
</div>
<script type="module">
  import * as BABYLON from 'https://cdn.babylonjs.com/babylon.js';
  import {createAssetById,createStoneTileMaterial,NARIS_ASSET_IDS} from './NarisAssetFactory.js';

  const canvas=document.getElementById('renderCanvas');
  const engine=new BABYLON.Engine(canvas,true,{antialias:true,adaptToDeviceRatio:true});
  const scene=new BABYLON.Scene(engine);
  scene.clearColor=new BABYLON.Color4(.018,.022,.035,1);
  const camera=new BABYLON.ArcRotateCamera('Camera',-Math.PI/2.2,Math.PI/2.55,7,new BABYLON.Vector3(0,1.45,0),scene);
  camera.attachControl(canvas,true); camera.wheelPrecision=45;
  const hemi=new BABYLON.HemisphericLight('Hemi',new BABYLON.Vector3(0,1,0),scene); hemi.intensity=.65;
  const key=new BABYLON.DirectionalLight('Key',new BABYLON.Vector3(-.4,-1,-.6),scene); key.intensity=2.0;
  const ground=BABYLON.MeshBuilder.CreateGround('Ground',{width:20,height:20},scene);
  ground.material=createStoneTileMaterial(scene);
  ground.material.bumpTexture.level=.45;

  const assets=[
    ['Ash Wanderer',NARIS_ASSET_IDS.ashWanderer],
    ['Marsh Seer',NARIS_ASSET_IDS.marshSeer],
    ['Castle Warden',NARIS_ASSET_IDS.castleWarden],
    ['Translucent Hero',NARIS_ASSET_IDS.translucentHero],
    ['Gate Guardian',NARIS_ASSET_IDS.gateGuardian],
    ['Waystone',NARIS_ASSET_IDS.waystone],
    ['Holy Portal',NARIS_ASSET_IDS.holyPortal]
  ];
  let current=null;
  function show(id,label){
    if(current) current.dispose();
    current=createAssetById(id,scene);
    current.position.y=0.05;
    if(id===NARIS_ASSET_IDS.waystone) camera.radius=5;
    else if(id===NARIS_ASSET_IDS.holyPortal) camera.radius=6.5;
    else camera.radius=6;
    document.getElementById('status').textContent=`ACTIVE  ${label}  •  ${id}`;
    [...document.querySelectorAll('button')].forEach(b=>b.classList.toggle('active',b.dataset.id===id));
  }
  const buttons=document.getElementById('buttons');
  assets.forEach(([label,id])=>{const b=document.createElement('button');b.textContent=label;b.dataset.id=id;b.onclick=()=>show(id,label);buttons.appendChild(b)});
  show(NARIS_ASSET_IDS.ashWanderer,'Ash Wanderer');
  engine.runRenderLoop(()=>scene.render());
  addEventListener('resize',()=>engine.resize());
</script>
</body>
</html>
